  </g>
      <text id="eyebrow" data-editable="text" x="182" y="264" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#070706">CAPSULE DROP</text>
      <text id="headline" data-editable="text" x="182" y="400" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="500" fill="#070706">PRIVATE SALE</text>
