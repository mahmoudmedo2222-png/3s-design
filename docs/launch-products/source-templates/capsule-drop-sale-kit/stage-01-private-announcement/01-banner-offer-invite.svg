      <text id="brand-name" data-editable="text" x="182" y="186" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#7c6030">BRAND NAME</text>
      
  <g id="editable-campaign-step" data-field="campaign-step">
    <text x="182" y="226" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c6030" letter-spacing="3">01 / PRIVATE ANNOUNCEMENT</text>
