<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">CDSK / 01 / Story / Offer Invite</title>
  <desc id="desc">Editable Stage 01 private announcement template for Capsule Drop Sale Kit. Channel: Instagram story. Variation: B.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1920">
      <stop offset="0" stop-color="#070706" />
      <stop offset="0.55" stop-color="#11100e" />
      <stop offset="1" stop-color="#181613" />
    </linearGradient>
    <linearGradient id="ivoryCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eadc" />
      <stop offset="1" stop-color="#ded1be" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6030" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c8a45d" />
      <stop offset="1" stop-color="#7c6030" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a241e" />
      <stop offset="0.35" stop-color="#8d7864" />
      <stop offset="0.7" stop-color="#302820" />
      <stop offset="1" stop-color="#130f0d" />
    </linearGradient>
    <pattern id="marble" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="#070706" />
      <path d="M-20 130 C 40 90, 80 190, 170 35" fill="none" stroke="#3e3931" stroke-width="2" opacity="0.45" />
      <path d="M10 20 C 70 80, 120 5, 190 80" fill="none" stroke="#cbb991" stroke-width="1" opacity="0.16" />
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>
  
  <rect width="1080" height="1920" fill="url(#bg)" />
  <rect width="1080" height="1920" fill="url(#marble)" opacity="0.18" />
  <g id="ambient-lines"><line x1="24" y1="0" x2="-56" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="144" y1="0" x2="64" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="264" y1="0" x2="184" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="384" y1="0" x2="304" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="504" y1="0" x2="424" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="624" y1="0" x2="544" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="744" y1="0" x2="664" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="864" y1="0" x2="784" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="984" y1="0" x2="904" y2="1920" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" /></g>
  <rect id="safe-area-guide" x="49" y="49" width="982" height="1822" fill="none" stroke="#c8a45d" stroke-width="1" stroke-dasharray="8 10" opacity="0.18" />
  <g id="template-master" data-product="capsule-drop-sale-kit" data-stage="01-private-announcement" data-channel="Instagram story" data-variation="B">
    
    <rect x="76" y="230" width="928" height="1306" rx="42" fill="url(#ivoryCard)" filter="url(#softShadow)" />
    <rect x="112" y="266" width="856" height="1234" rx="30" fill="none" stroke="#c8a45d" stroke-width="2" opacity="0.72" />
    
  <g id="editable-product-image" data-field="product-image" filter="url(#softShadow)">
    <rect x="148" y="844" width="784" height="366" rx="28" fill="url(#silk)" />
    <path d="M289.12 1144.12 C 414.56 953.8, 634.0799999999999 1224.6399999999999, 837.92 909.88" fill="none" stroke="#f3dec1" stroke-opacity="0.2" stroke-width="4.704" />
    <path d="M210.72 902.56 L 869.2800000000001 1173.4" stroke="#c8a45d" stroke-width="3.136" opacity="0.42" />
    <circle cx="743.84" cy="931.84" r="29.28" fill="#0d0c0a" opacity="0.55" />
    <text x="540" y="1027" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#f2eadc" opacity="0.78" letter-spacing="4">EDIT IMAGE</text>
  </g>
    <g id="editable-copy" data-field-group="copy">
      <text id="brand-name" data-editable="text" x="146" y="348" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5" fill="#7c6030">BRAND NAME</text>
      
  <g id="editable-campaign-step" data-field="campaign-step">
    <text x="146" y="388" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c6030" letter-spacing="3">01 / PRIVATE ANNOUNCEMENT</text>
    <line x1="146" y1="406" x2="304" y2="406" stroke="#070706" stroke-width="2" opacity="0.72" />
  </g>
      <text id="eyebrow" data-editable="text" x="146" y="432" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#070706">OPEN FOR 48 HOURS</text>
      <text id="headline" data-editable="text" x="146" y="566" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="500" fill="#070706">SALE ACCESS</text>
      <text id="subline" data-editable="text" x="150" y="650" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="0" fill="#50483f">Limited pieces. Quiet pricing. Premium presentation.</text>
      <g id="editable-campaign-meta" data-field-group="campaign-meta">
      <g class="editable-meta-row" data-field="collection-name">
        <text x="150" y="722" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c6030" letter-spacing="2.4">COLLECTION</text>
        <text x="150" y="750" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#070706">Private Wardrobe Drop</text>
      </g>

      <g class="editable-meta-row" data-field="sale-window">
        <text x="150" y="780" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c6030" letter-spacing="2.4">SALE WINDOW</text>
        <text x="150" y="808" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#070706">48 hours only</text>
      </g></g>
      
  <g id="editable-cta" data-field="cta">
    <rect x="146" y="1396" width="360" height="78" rx="39" fill="#070706" />
    <text x="326" y="1444.36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#c8a45d" letter-spacing="2">ENTER THE DROP</text>
  </g>
      
  <g id="editable-offer-badge" data-field="offer">
    <rect x="744" y="1376" width="170" height="105" rx="12.6" fill="#070706" stroke="#c8a45d" stroke-width="2" />
    <text x="829" y="1415.9" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#c8a45d" letter-spacing="3">LIMITED</text>
    <text x="829" y="1451.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#f2eadc">48H</text>
  </g>
      
  <g class="editable-detail-pill" data-field="campaign-detail">
    <rect x="516" y="1408" width="220" height="40" rx="20" fill="#f2eadc" stroke="#7c6030" stroke-width="1" opacity="1" />
    <text x="626" y="1434" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#070706" letter-spacing="1.4">PRIVATE15</text>
  </g>
    </g>
  </g>
</svg>
