<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">CDSK / 01 / Post / Offer Invite</title>
  <desc id="desc">Editable Stage 01 private announcement template for Capsule Drop Sale Kit. Channel: Instagram post. Variation: B.</desc>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1080" y2="1080">
      <stop offset="0" stop-color="#070706" />
      <stop offset="0.55" stop-color="#11100e" />
      <stop offset="1" stop-color="#181613" />
    </linearGradient>
    <linearGradient id="ivoryCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eadc" />
      <stop offset="1" stop-color="#ded1be" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c6030" stop-opacity="0" />
      <stop offset="0.5" stop-color="#c8a45d" />
      <stop offset="1" stop-color="#7c6030" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a241e" />
      <stop offset="0.35" stop-color="#8d7864" />
      <stop offset="0.7" stop-color="#302820" />
      <stop offset="1" stop-color="#130f0d" />
    </linearGradient>
    <pattern id="marble" width="180" height="180" patternUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="#070706" />
      <path d="M-20 130 C 40 90, 80 190, 170 35" fill="none" stroke="#3e3931" stroke-width="2" opacity="0.45" />
      <path d="M10 20 C 70 80, 120 5, 190 80" fill="none" stroke="#cbb991" stroke-width="1" opacity="0.16" />
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>
  
  <rect width="1080" height="1080" fill="url(#bg)" />
  <rect width="1080" height="1080" fill="url(#marble)" opacity="0.18" />
  <g id="ambient-lines"><line x1="24" y1="0" x2="-56" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="144" y1="0" x2="64" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="264" y1="0" x2="184" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="384" y1="0" x2="304" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="504" y1="0" x2="424" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="624" y1="0" x2="544" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="744" y1="0" x2="664" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="864" y1="0" x2="784" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" />
<line x1="984" y1="0" x2="904" y2="1080" stroke="#c8a45d" stroke-opacity="0.055" stroke-width="1" /></g>
  <rect id="safe-area-guide" x="49" y="49" width="982" height="982" fill="none" stroke="#c8a45d" stroke-width="1" stroke-dasharray="8 10" opacity="0.18" />
  <g id="template-master" data-product="capsule-drop-sale-kit" data-stage="01-private-announcement" data-channel="Instagram post" data-variation="B">
    
  <rect x="76" y="76" width="928" height="928" rx="36" fill="url(#ivoryCard)" filter="url(#softShadow)" />
  <rect x="110" y="110" width="860" height="860" rx="24" fill="none" stroke="#c8a45d" stroke-width="2" opacity="0.72" />
  
  <g id="editable-product-image" data-field="product-image" filter="url(#softShadow)">
    <rect x="614" y="224" width="251" height="483" rx="10.040000000000001" fill="url(#silk)" />
    <path d="M659.18 620.06 C 699.34 368.9, 769.62 726.3199999999999, 834.88 310.94" fill="none" stroke="#f3dec1" stroke-opacity="0.2" stroke-width="2" />
    <path d="M634.08 301.28 L 844.9200000000001 658.7" stroke="#c8a45d" stroke-width="2" opacity="0.42" />
    <circle cx="804.76" cy="339.92" r="20.080000000000002" fill="#0d0c0a" opacity="0.55" />
    <text x="739.5" y="465.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#f2eadc" opacity="0.78" letter-spacing="4">ITEM</text>
  </g>
  <g id="editable-copy" data-field-group="copy">
    <text id="brand-name" data-editable="text" x="138" y="172" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="5" fill="#7c6030">BRAND NAME</text>
    
  <g id="editable-campaign-step" data-field="campaign-step">
    <text x="138" y="212" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7c6030" letter-spacing="3">01 / PRIVATE ANNOUNCEMENT</text>
    <line x1="138" y1="230" x2="296" y2="230" stroke="#070706" stroke-width="2" opacity="0.72" />
  </g>
    <text id="eyebrow" data-editable="text" x="138" y="258" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#070706">LIMITED ACCESS</text>
    <text id="headline" data-editable="text" x="138" y="400" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="500" fill="#070706">PRIVATE SALE</text>
    <text id="subline" data-editable="text" x="142" y="478" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#50483f">A quiet offer for selected pieces.</text>
    
  <g class="editable-detail-pill" data-field="campaign-detail">
    <rect x="138" y="532" width="180" height="40" rx="20" fill="#f2eadc" stroke="#7c6030" stroke-width="1" opacity="1" />
    <text x="228" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#070706" letter-spacing="1.4">48 hours only</text>
  </g>
    
  <g class="editable-detail-pill" data-field="campaign-detail">
    <rect x="336" y="532" width="150" height="40" rx="20" fill="#f2eadc" stroke="#7c6030" stroke-width="1" opacity="1" />
    <text x="411" y="558" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#070706" letter-spacing="1.4">PRIVATE15</text>
  </g>
    
  <g id="editable-cta" data-field="cta">
    <rect x="138" y="616" width="320" height="68" rx="34" fill="#070706" />
    <text x="298" y="658.16" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#c8a45d" letter-spacing="2">UNLOCK THE OFFER</text>
  </g>
    
  <g id="editable-proof-cue" data-field="proof-cue">
    <line x1="138" y1="726" x2="468" y2="726" stroke="#7c6030" stroke-width="1" opacity="0.38" />
    <text x="138" y="755" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#50483f" letter-spacing="0.6">Limited sizes</text>
  </g>
    
  <g id="editable-offer-badge" data-field="offer">
    <rect x="140" y="834" width="180" height="110" rx="13.2" fill="#070706" stroke="#c8a45d" stroke-width="2" />
    <text x="230" y="875.8" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#c8a45d" letter-spacing="3">LIMITED</text>
    <text x="230" y="913.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="33" fill="#f2eadc">48H</text>
  </g>
  </g>
  </g>
